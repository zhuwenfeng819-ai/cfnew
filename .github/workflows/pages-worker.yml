name: Generate Pages Worker

# 上游更新「明文源吗」后，obfuscate.yml 会重新生成「少年你相信光吗」并推送，
# 本工作流随之更新 Pages 的部署入口 _worker.js。
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - '少年你相信光吗'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate _worker.js
        run: cp '少年你相信光吗' _worker.js

      - name: Commit and push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          if git diff --staged --quiet; then
            echo "_worker.js 已是最新，无需提交"
          else
            git commit -m "chore: 同步 _worker.js（Cloudflare Pages 部署入口）"
            git push
          fi
